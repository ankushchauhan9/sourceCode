apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubernetes-app
  template:
    metadata:
        labels:
          app: kubernetes-app
    spec:
      containers:
        - name: kubernetes-app
          image: 111docker222/kubernetes-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080